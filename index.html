<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 20 Soccer Cleats</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f2;
            color: #222;
        }

        /* Animated header */
        header {
            background: #063d26;
            color: white;
            text-align: center;
            padding: 35px 15px;
            animation: slideDown 0.8s ease;
        }

        header h1 {
            margin: 0 0 10px;
            animation: fadeIn 1.2s ease;
        }

        /* Navigation */
        nav {
            background: #092f21;
            padding: 15px;
            text-align: center;
        }

        nav a {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin: 8px 15px;
            transition: color 0.3s, transform 0.3s;
        }

        nav a:hover {
            color: #70ff9b;
            transform: scale(1.1);
        }

        /* Search and brand filter */
        .controls {
            text-align: center;
            padding: 25px 10px;
            animation: fadeIn 1s ease;
        }

        input, select {
            padding: 12px;
            margin: 5px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #087a40;
            box-shadow: 0 0 8px #087a4070;
        }

        /* Product grid */
        #products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        /* Animated cleat cards */
        .cleat {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 3px 10px #00000015;
            animation: fadeUp 0.6s ease both;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cleat:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 12px 25px #087a4050;
        }

        /* Cleat picture zoom */
        .cleat img {
            width: 100%;
            height: 170px;
            object-fit: contain;
            background: #f7f9f7;
            border-radius: 8px;
            transition: transform 0.4s ease;
        }

        .cleat:hover img {
            transform: scale(1.08);
        }

        .cleat h3 {
            font-size: 16px;
            min-height: 40px;
        }

        .brand {
            color: #666;
        }

        .price {
            color: #087a40;
            font-size: 22px;
            font-weight: bold;
        }

        /* Animated buttons */
        .cleat a {
            display: inline-block;
            background: #087a40;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.3s, transform 0.3s;
        }

        .cleat a:hover {
            background: #063d26;
            transform: scale(1.08);
        }

        /* About section */
        #about {
            text-align: center;
            padding: 30px;
            animation: fadeIn 1s ease;
        }

        /* Footer */
        footer {
            background: #063d26;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Animation keyframes */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tablet layout */
        @media (max-width: 900px) {
            #products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Phone layout */
        @media (max-width: 500px) {
            #products {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 27px;
            }
        }

        /* Respect reduced-motion settings */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ Top 20 Soccer Cleats</h1>
    <p>Find the right cleats for your game!</p>
</header>

<nav>
    <a href="#products">Cleats</a>
    <a href="#about">About</a>
</nav>

<div class="controls">
    <input
        type="text"
        id="search"
        placeholder="Search soccer cleats..."
        aria-label="Search cleats"
    >

    <select id="brand" aria-label="Filter by brand">
        <option value="All">All Brands</option>
        <option value="Nike">Nike</option>
        <option value="adidas">adidas</option>
        <option value="PUMA">PUMA</option>
        <option value="New Balance">New Balance</option>
    </select>
</div>

<h2 style="text-align:center;">Our Top 20 Cleats</h2>

<div id="products"></div>

<section id="about">
    <h2>About This Website</h2>
    <p>Explore 20 popular soccer cleats from four major brands.</p>
    <p>Prices are examples and may change by store and model.</p>
</section>

<footer>
    <p>⚽ Soccer Cleats © 2026</p>
</footer>

<script>
const cleats = [
    ["Nike Mercurial Superfly Elite", "Nike", 295],
    ["Nike Mercurial Vapor Elite", "Nike", 260],
    ["Nike Phantom Elite", "Nike", 260],
    ["Nike Tiempo Elite", "Nike", 250],
    ["adidas Predator Elite", "adidas", 280],
    ["adidas F50 Elite", "adidas", 270],
    ["adidas Copa Pure Elite", "adidas", 250],
    ["adidas Predator Pro", "adidas", 170],
    ["PUMA Future Ultimate", "PUMA", 245],
    ["PUMA Future Pro", "PUMA", 145],
    ["PUMA Future Match", "PUMA", 95],
    ["PUMA Ultra Ultimate", "PUMA", 240],
    ["New Balance Furon Elite", "New Balance", 225],
    ["New Balance Furon Pro", "New Balance", 150],
    ["New Balance Furon Team", "New Balance", 95],
    ["Nike Mercurial Vapor Pro", "Nike", 160],
    ["Nike Mercurial Superfly Pro", "Nike", 170],
    ["Nike Mercurial Vapor Academy", "Nike", 95],
    ["Nike Mercurial Vapor Club", "Nike", 70],
    ["adidas Predator League", "adidas", 100]
];

const products = document.getElementById("products");
const search = document.getElementById("search");
const brand = document.getElementById("brand");

function showCleats() {
    products.innerHTML = "";

    const filtered = cleats.filter(c => {
        return c[0].toLowerCase().includes(search.value.toLowerCase())
            && (brand.value === "All" || c[1] === brand.value);
    });

    if (filtered.length === 0) {
        products.innerHTML =
            "<p>No cleats found. Try another search.</p>";
        return;
    }

    filtered.forEach((c, index) => {
        const name = c[0];
        const maker = c[1];
        const price = c[2];

        const picture =
            "https://placehold.co/500x300/eaf3ee/063d26?text="
            + encodeURIComponent(name);

        products.innerHTML += `
            <div class="cleat" style="animation-delay:${index * 0.05}s">
                <img
                    src="${picture}"
                    alt="${name}"
                    loading="lazy"
                >
                <h3>${name}</h3>
                <p class="brand">${maker}</p>
                <p class="price">$${price}</p>
                <a
                    href="https://www.google.com/search?q=${encodeURIComponent(name)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Find Cleats
                </a>
            </div>
        `;
    });
}

search.addEventListener("input", showCleats);
brand.addEventListener("change", showCleats);

showCleats();
</script>

</body>
</html>
